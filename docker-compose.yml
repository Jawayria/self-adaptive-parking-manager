services:
  # MQTT Broker (Mosquitto)
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: parking-mqtt-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - parking-network

  # InfluxDB (Time-series database for Knowledge Base)
  influxdb:
    image: influxdb:2.7
    container_name: parking-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=parking-org
      - DOCKER_INFLUXDB_INIT_BUCKET=parking_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    restart: unless-stopped
    networks:
      - parking-network

  # Grafana (Visualization Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: parking-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=adminadmin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb
    restart: unless-stopped
    networks:
      - parking-network

  # ==========================================================================
  # MAPE-K Microservices
  # ==========================================================================

  # Monitor Service - Collects sensor data and calculates system metrics
  monitor:
    build:
      context: .
      dockerfile: services/monitor/Dockerfile
    container_name: parking-monitor
    depends_on:
      - mqtt-broker
      - influxdb
    restart: unless-stopped
    networks:
      - parking-network

  # Analyzer Service - Analyzes parking lot state and detects issues
  analyzer:
    build:
      context: .
      dockerfile: services/analyzer/Dockerfile
    container_name: parking-analyzer
    depends_on:
      - mqtt-broker
      - monitor
    restart: unless-stopped
    networks:
      - parking-network

  # Planner Service - Creates adaptation decisions with cooldown logic
  planner:
    build:
      context: .
      dockerfile: services/planner/Dockerfile
    container_name: parking-planner
    depends_on:
      - mqtt-broker
      - influxdb
      - analyzer
    restart: unless-stopped
    networks:
      - parking-network

  # Executor Service - Sends control commands to parking lots
  executor:
    build:
      context: .
      dockerfile: services/executor/Dockerfile
    container_name: parking-executor
    depends_on:
      - mqtt-broker
      - influxdb
      - planner
    restart: unless-stopped
    networks:
      - parking-network

  # Simulator Service - Generates parking lot sensor data
  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    container_name: parking-simulator
    depends_on:
      - mqtt-broker
    restart: unless-stopped
    networks:
      - parking-network

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:

networks:
  parking-network:
    driver: bridge
